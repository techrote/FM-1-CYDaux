[platformio]
default_envs = cyd
src_dir = .
[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
board_build.f_flash = 40000000L
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Iinclude
    -include firmware/board_config.hpp
build_src_filter =
    +<src/*.cpp>
    +<firmware/*.cpp>
    -<tests/>
    -<simulator/>
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@6.21.5
